<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
    .text-white{
    color:white}
    .card-img-top {
      height: 300px;
      object-fit: cover;
    }
    .card:hover {
  transform: scale(1.03);
  transition: 0.3s;
}

    .nav-link:hover {
  color: white !important;
  background-color: #d63384;
  border-radius: 5px;
  transition: 0.3s;
}

</style>
<body style="background-color:black">
<nav class="navbar navbar-expand-lg" style="background-color:#ff69b4; padding:10px 20px;">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-dark" href="#">📚  Book Recommender</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="/">Home</a></li>
      <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="/recommend">Recommend</a></li>

    </ul>
  </div>
</nav>

<header class="text-center py-5" style="background:linear-gradient(to right, #ff69b4, #ffb6c1); color:white;">
  <h1 class="fw-bold">Top 50 Books</h1>
  <p class="lead">Discover the most loved stories, handpicked for you</p>
</header>



<div class="container">
    <div class="row">
<div class="col-md-12">

    <h1 class="text-white" style="font-size:35px"> Top Recommendations</h1>

</div>


        {%for i in range(book_name|length)%}
          <div class="col-md-3 mb-4">
  <div class="card h-100">
    <img src="{{ image[i] }}" class="card-img-top" alt="{{ book_name[i] }}">
    <div class="card-body bg-dark text-white">
      <h5 class="card-title">{{ book_name[i] }}</h5>
      <p class="card-text">Author: {{ author[i] }}</p>
      <p class="card-text">Votes: {{ votes[i] }}</p>
      <p class="card-text">Ratings: {{ "%.1f"|format(rating[i]) }}</p>
    </div>
  </div>
</div>

        {% endfor %}


    </div>
</div>
</body>
</html>
